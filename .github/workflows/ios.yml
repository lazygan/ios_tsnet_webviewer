name: ios-unsigned

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.27.3"
  GOMOBILE_VERSION: "v0.0.0-20261011034528-197770444867"

jobs:
  go-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  ios-build:
    needs: go-test
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go/go.sum

      - name: Cache Go build
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ env.GO_VERSION }}-${{ hashFiles('go/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ env.GO_VERSION }}-

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}
          go install golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Init gomobile
        run: gomobile init

      - name: Cache XCFramework
        id: framework
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/Tailbridge.xcframework
          key: fw-${{ runner.os }}-${{ env.GO_VERSION }}-${{ env.GOMOBILE_VERSION }}-${{ hashFiles('go/**', 'scripts/build_go.sh') }}

      - name: Build XCFramework
        if: steps.framework.outputs.cache-hit != 'true'
        run: bash scripts/build_go.sh

      - name: Inspect SDK proxy APIs
        run: bash scripts/check_sdk_headers.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/TailBrowser.xcodeproj \
            -scheme TailBrowser \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build-xcodebuild.log

      - name: Package unsigned IPA
        run: bash scripts/package_ipa.sh

      - name: Verify IPA
        run: bash scripts/verify_ipa.sh

      - name: Record toolchain
        run: |
          {
            echo "go: $(go version)"
            echo "tailscale: $(cd go && go list -m tailscale.com)"
            echo "gomobile: ${GOMOBILE_VERSION}"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "xcodegen: $(xcodegen --version)"
            echo "sdk: $(xcrun --sdk iphoneos --show-sdk-version)"
          } | tee build-toolchain.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: TailBrowser-unsigned-${{ github.sha }}
          path: |
            build/TailBrowser-unsigned.ipa
            build-xcodebuild.log
            build-toolchain.txt
          retention-days: 7
          if-no-files-found: error
