name: TailBrowser

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # No app icon yet; XcodeGen defaults this to "AppIcon" and actool fails
    # when the asset catalog has no matching set.
    ASSETCATALOG_COMPILER_APPICON_NAME: ""

targets:
  TailBrowser:
    type: application
    platform: iOS
    sources:
      - path: TailBrowser/Sources
      - path: TailBrowser/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tailweb
        PRODUCT_NAME: TailWeb
        INFOPLIST_FILE: TailBrowser/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: NO
    dependencies:
      # gomobile bind is expected to produce a static framework. If Phase 0
      # shows a dynamic library instead, set embed to true and re-test signing.
      - framework: Frameworks/Tailbridge.xcframework
        embed: false

schemes:
  TailBrowser:
    build:
      targets:
        TailBrowser: all
    run:
      config: Debug
